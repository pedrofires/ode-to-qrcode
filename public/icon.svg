  <!-- Tampo superior da harpa -->
  <path d="M60 20 Q140 40 160 80" stroke="#8B5E3C" stroke-width="10" fill="none"/>

  <!-- Cordas da harpa -->
  <line x1="60" y1="20" x2="60" y2="280" stroke="#cccccc" stroke-width="1"/>
  <line x1="70" y1="22" x2="61" y2="280" stroke="#cccccc" stroke-width="1"/>
  <line x1="80" y1="25" x2="62" y2="280" stroke="#cccccc" stroke-width="1"/>
